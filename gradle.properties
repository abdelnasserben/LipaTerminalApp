org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# Komopay Terminal API configuration (read by app/build.gradle.kts).
# The app always talks to a real backend — there is no mock mode.
#
# Select the environment with the ENV property:
#   -PENV=local  -> http://localhost:8080  (default)
#   -PENV=prod   -> https://api.lipa.km
# Override the URL directly with -PKOMOPAY_API_BASE_URL=... (wins over ENV).
#
# For a local backend on a USB-connected physical device, first run:
#   adb reverse tcp:8080 tcp:8080
ENV=local
