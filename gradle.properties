org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# Komopay Terminal API configuration (read by app/build.gradle.kts).
# Toggle between the in-app mock and the real HTTP backend without touching code.
# For local backend on a USB-connected device: run `adb reverse tcp:8080 tcp:8080` first.
KOMOPAY_USE_MOCK_API=false
KOMOPAY_API_BASE_URL=http://localhost:8080
